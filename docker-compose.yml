services:
  # MySQL 8.0 - 数据库
  mysql:
    image: mysql:8.0
    container_name: pureblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: pureblog
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 数字前缀强制 initdb.d 执行顺序: tree -> widget -> finance
      # (init_finance.sql 依赖 pb_widget 已存在)
      - ./backend/sql/init_tree.sql:/docker-entrypoint-initdb.d/01_init_tree.sql:ro
      - ./backend/sql/init_widget.sql:/docker-entrypoint-initdb.d/02_init_widget.sql:ro
      - ./backend/sql/init_finance.sql:/docker-entrypoint-initdb.d/03_init_finance.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - pureblog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis 7 - 缓存
  redis:
    image: redis:7
    container_name: pureblog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pureblog-net

  # JDK17 + Maven - 编译运行环境 (后端跑在本容器内, 通过 pureblog-net 连 mysql/redis)
  jdk17:
    image: maven:3.9-eclipse-temurin-17
    container_name: pureblog-jdk17
    restart: unless-stopped
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
      - ./logs:/workspace/logs
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m
      # 容器内走 service 名, 不走 127.0.0.1
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pureblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "8080:8080"      # 后端 API
      - "5005:5005"      # 远程调试
    networks:
      - pureblog-net
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  redis_data:
  maven_cache:

networks:
  pureblog-net:
    driver: bridge
